<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
  <div class="pref-section">
    <label>TMDB Read API Key (optional — overrides the key baked in at build time):</label>
    <input type="text" data-pref-key="tmdbApiKey" style="width: 100%; margin-top: 2px" />
  </div>
  <div class="pref-section">
    <label>TheIntroDB API Key (optional, only needed to see your pending submissions):</label>
    <input type="text" data-pref-key="tidbApiKey" style="width: 100%; margin-top: 2px" />
  </div>
  <div class="pref-section">
    <label>
      <input type="checkbox" data-type="bool" data-pref-key="autoSkip" />
      Automatically skip intros and recaps
    </label>
  </div>
  <div class="pref-section">
    <label>Auto-skip segment types (comma-separated: intro, recap, credits, preview):</label>
    <input type="text" data-pref-key="autoSkipTypes" style="width: 100%; margin-top: 2px" />
  </div>
</body>
</html>
